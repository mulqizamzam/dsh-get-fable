name: Validate DSH bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module syntax
        run: node --check index.js
      - name: Check validator and smoke-test syntax
        run: node --check scripts/validate-bundle.mjs && node --check scripts/smoke-provider.mjs
      - name: Validate package manifest and all bundled skills
        run: node scripts/validate-bundle.mjs && node scripts/smoke-provider.mjs
